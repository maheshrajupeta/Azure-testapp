<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #0078d4;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #0078d4;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .health {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>Azure App Service + .NET</p>
</header>

<div class="container">

    <div class="card">
        <h2>Application Status</h2>
        <p class="health" id="health">Checking...</p>
    </div>

    <div class="card">
        <h2>Employees</h2>

        <button onclick="loadEmployees()">
            Refresh Employees
        </button>

        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                </tr>
            </thead>

            <tbody id="employeeTable">
            </tbody>
        </table>
    </div>

</div>

<script>

async function checkHealth() {

    try {

        const response = await fetch('/health');

        const result = await response.text();

        document.getElementById('health').innerText = result;

    } catch (error) {

        document.getElementById('health').innerText =
            'Application is not responding';

    }
}


async function loadEmployees() {

    try {

        const response = await fetch('/api/employees');

        const employees = await response.json();

        const table = document.getElementById('employeeTable');

        table.innerHTML = '';

        employees.forEach(employee => {

            const row = `
                <tr>
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td>${employee.department}</td>
                </tr>
            `;

            table.innerHTML += row;

        });

    } catch (error) {

        console.error(error);

    }
}


checkHealth();

loadEmployees();

</script>

</body>
</html>
