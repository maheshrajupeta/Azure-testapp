name: Build and Deploy .NET 11 Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0.x'
  AZURE_WEBAPP_NAME: 'test-3-hnhtc0cphkfdb5a6'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Verify .NET Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Application
        run: dotnet build --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish --configuration Release --no-restore --output ./publish

      - name: Check Published Files
        run: |
          echo "========== PUBLISHED FILES =========="
          find ./publish -type f

          echo "========== WWWROOT =========="
          find ./publish/wwwroot -type f || true

      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download Application
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Show Deployment Files
        run: |
          echo "========== DEPLOYMENT FILES =========="
          find ./publish -type f

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: test-3-hnhtc0cphkfdb5a6
          package: ./publish